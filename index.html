<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayn — clean Arabic &amp; English addresses, planned routes</title>
    <meta name="description" content="Wayn turns messy Arabic and English delivery addresses into clean fields and map pins, then plans the shortest route through them." />
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* shown before the app loads; lifted by window.bootDone() once the hero map has tiles */
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0A0E27;transition:opacity .45s ease}
      #boot.out{opacity:0;pointer-events:none}
      #boot div{display:flex;flex-direction:column;align-items:center;gap:22px}
      #boot svg{animation:boot-drop 1.4s ease-in-out infinite}
      #boot i{display:block;width:120px;height:2px;border-radius:1px;background:rgba(255,255,255,.08);overflow:hidden}
      #boot i::after{content:'';display:block;width:40%;height:100%;background:#F5C842;border-radius:1px;animation:boot-run 1.1s ease-in-out infinite}
      @keyframes boot-drop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes boot-run{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion: reduce){#boot svg,#boot i::after{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Wayn">
      <div>
        <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 20c0 11 7.2 19 16 19s16-8 16-19" fill="none" stroke="#F5C842" stroke-width="6" stroke-linecap="round"/><path d="M24 27c-3.6-4.4-7-7.4-7-11.4a7 7 0 0 1 14 0c0 4-3.4 7-7 11.4Z" fill="#F5C842"/><circle cx="24" cy="15.6" r="2.6" fill="#0A0E27"/></svg>
        <i></i>
      </div>
    </div>
    <script>
      window.bootDone = function () {
        var b = document.getElementById('boot');
        if (!b || b.classList.contains('out')) return;
        b.classList.add('out');
        setTimeout(function () { b.remove(); }, 500);
      };
      // never hold the page longer than this, even if the map is slow
      setTimeout(window.bootDone, 5000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
